<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Saisie des notes</title>
</head>
<body>
    <h1>Saisie des notes d'un apprenant (méthode POST)</h1>
    <form action="traitement.php" method="post">
        <p>Nom : <input type="text" name="nom" /></p>
        <p>Note d'informatique : <input type="number" name="note_info" min="0" max="20" step="0.01" /></p>
        <p>Note de mathématiques : <input type="number" name="note_math" min="0" max="20" step="0.01" /></p>
        <p><input type="submit" value="Enregistrer"></p>
    </form>
    <p><a href="liste.php">Voir la liste des notes</a></p>
</body>
</html>
